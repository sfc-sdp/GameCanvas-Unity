name: Build docs

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-src/package-lock.json
      - name: Generate API and build the guides from this revision
        run: bash scripts/build-docs.sh
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(docs): auto-generated"
          git push origin "HEAD:${GITHUB_REF_NAME}"
